<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anthony Ropa | Moda</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#160025,#36005c,#100018);
    color:white;
    min-height:100vh;
}

header{
    text-align:center;
    padding:25px 15px;
    background:rgba(0,0,0,.35);
    border-bottom:1px solid rgba(255,255,255,.15);
}

.logo{
    font-size:34px;
    font-weight:bold;
    letter-spacing:2px;
}

.logo span{
    color:#d78cff;
}

header p{
    margin-top:8px;
    color:#ddd;
}

.container{
    width:94%;
    max-width:1100px;
    margin:auto;
}

.hero{
    text-align:center;
    padding:35px 15px;
}

.hero h1{
    font-size:32px;
    margin-bottom:10px;
}

.hero p{
    color:#ddd;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
    padding:20px 0 40px;
}

.product{
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.15);
    border-radius:18px;
    padding:15px;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,.3);
}

.product img{
    width:100%;
    height:230px;
    object-fit:cover;
    border-radius:14px;
    background:#eee;
}

.product h3{
    margin:12px 0 7px;
}

.price{
    font-size:21px;
    font-weight:bold;
    color:#e3a4ff;
    margin-bottom:12px;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 16px;
    cursor:pointer;
    font-weight:bold;
}

.add{
    width:100%;
    background:#9d38e6;
    color:white;
}

.add:hover{
    background:#b95cff;
}

.cart{
    background:rgba(0,0,0,.4);
    border-radius:20px;
    padding:25px;
    margin:20px 0 40px;
}

.cart h2{
    margin-bottom:15px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid rgba(255,255,255,.15);
}

.remove{
    background:#b51f3d;
    color:white;
    padding:7px 10px;
}

.total{
    font-size:24px;
    font-weight:bold;
    margin:20px 0;
    text-align:right;
}

.checkout{
    background:#20c76b;
    color:white;
    width:100%;
    font-size:17px;
}

.payment{
    display:none;
    background:white;
    color:#222;
    padding:25px;
    border-radius:20px;
    margin-bottom:40px;
}

.payment h2{
    color:#4b176d;
    margin-bottom:15px;
}

.payment label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}

.payment input,
.payment select{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:8px;
}

.pay-button{
    margin-top:20px;
    width:100%;
    background:#7b22b3;
    color:white;
    font-size:16px;
}

.whatsapp{
    display:block;
    text-align:center;
    margin-top:15px;
    padding:13px;
    border-radius:10px;
    background:#25d366;
    color:white;
    text-decoration:none;
    font-weight:bold;
}

footer{
    text-align:center;
    padding:30px 15px;
    background:rgba(0,0,0,.4);
    color:#ccc;
}

@media(max-width:500px){
    .logo{
        font-size:28px;
    }

    .hero h1{
        font-size:26px;
    }

    .product img{
        height:210px;
    }
}
</style>
</head>

    </div>
    <p>Moda urbana • Estilo • Calidad</p>
</header>

    <h1>Tu estilo comienza aquí</h1>
    <p>Descubre nuestra colección de ropa.</p>
</section>
